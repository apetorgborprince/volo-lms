{% extends "base.html" %}{% block content %}
<div class="head"><div><h1>Change Password</h1><p>Protect your Volo LMS account with a new password.</p></div></div>
<section class="panel management-card" style="max-width:620px"><form method="post" class="management-form">
<label>Current password<input type="password" name="current_password" required></label>
<label>New password<input type="password" name="new_password" minlength="12" required><small>Use at least 12 characters with upper/lowercase, a number and a symbol.</small></label>
<label>Confirm new password<input type="password" name="confirm_password" minlength="12" required></label>
<button type="submit">Change password</button></form></section>
{% endblock %}
