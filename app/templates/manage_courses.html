{% extends "base.html" %}{% block content %}
<div class="head"><div><h1>Course Management</h1><p>Create curriculum-aligned General Science learning.</p></div><button onclick="addCourse()">+ Add course</button></div><div id="manageCourses" class="cards"></div>
<section class="panel lesson-planner"><div class="panel-heading"><h2>Create an aligned lesson</h2><span>Official curriculum mapping required</span></div><form id="lessonPlanner"><div class="planner-grid"><label>Course<select name="course_id" id="lessonCourse" required></select></label><label>Lesson title<input name="title" required placeholder="e.g. Characteristics of science in everyday life"></label><label>Material type<select name="material_type"><option>Reading</option><option>Video</option><option>Practical</option><option>Simulation</option><option>Worksheet</option></select></label><label>Learning indicators<select name="learning_indicator_id" id="lessonIndicators" multiple required aria-describedby="indicatorHelp"></select><small id="indicatorHelp">Select one or more verified indicators.</small></label></div><label class="planner-content">Lesson notes / teaching content<textarea name="content" placeholder="Add lesson content, activities or teacher notes."></textarea></label><div class="planner-actions"><button type="submit">Create curriculum-aligned lesson</button><span id="lessonPlannerStatus" aria-live="polite"></span></div></form></section>
{% endblock %}
